# Reads the curated sources, writes digests and publishes the result to GitHub Pages.
#
# Three jobs with different rights:
#   fetch-and-normalize  talks to the publishers. It has no secrets.
#   digest               the only job that is given OPENROUTER_API_KEY. It talks to nobody else.
#   publish              builds the output, checks it, and only then deploys it. A run that fails anywhere publishes nothing,
#                        so the last good output stays online.
#
# Every action is pinned to a full commit SHA (looked up with `git ls-remote` on 2026-11-14); the comment gives the tag.
name: Process sources

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours, off the top of the hour
  workflow_dispatch:

# Nothing by default; each job states what it needs.
permissions: {}

# One run at a time, and a run that has started is allowed to finish.
concurrency:
  group: process-and-publish
  cancel-in-progress: false

env:
  PAGES_URL: https://gptkiosk.github.io/pea-knowledge-processor/
  PYTHON_VERSION: "3.12"

jobs:
  fetch-and-normalize:
    name: Fetch and normalize (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bring back the last published output (the pipeline's memory)
        run: python3 -m pea_knowledge restore --url "$PAGES_URL" --out previous
      - name: Fetch and normalize
        run: python3 -m pea_knowledge fetch --config config/sources.json --work work --previous previous
      - name: Hand over to the next job
        # The work folder holds transcripts that may not be republished. It is kept for one day only.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fetched
          path: |
            previous/
            work/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  digest:
    name: Digest (the only job with the model key)
    needs: fetch-and-normalize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fetched
      - name: Write digests
        # Without the secret, or with the model switched off in config/sources.json, every digest is extractive.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 -m pea_knowledge digest --config config/sources.json --work work
      - name: Hand over to the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digested
          path: |
            previous/
            work/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Build, check and publish
    needs: digest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digested
      - name: Build the output (the health report goes to the run summary)
        run: python3 -m pea_knowledge build --config config/sources.json --work work --previous previous --out dist --summary "$GITHUB_STEP_SUMMARY"
      - name: Check the output as an app would
        run: python3 -m pea_knowledge validate dist
      - name: Package for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  keep-alive:
    # GitHub switches a scheduled workflow off when the repository has had no activity for 60 days. This job asks
    # GitHub to enable this same workflow, which it already is: the call changes nothing, but it counts as activity
    # for that rule. No commit, no branch, no extra action to pin; a call made with the job's own token never starts
    # another workflow run, so it cannot loop. It runs on scheduled runs only, also when an earlier job failed, so a
    # stretch of failing runs does not let the schedule lapse. If GitHub ever refuses the call, the job fails
    # visibly and nothing else is affected (README.md, "The schedule stays on").
    name: Keep the schedule on
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow (it is already enabled)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 -X PUT \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/process.yml/enable"
          echo "The schedule was confirmed at $(date -u +%Y-%m-%dT%H:%M:%SZ)." >> "$GITHUB_STEP_SUMMARY"
