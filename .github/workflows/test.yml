# Runs the tests on every pull request and on main. No secrets, no network beyond installing Python.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python3 -I -m unittest
      - name: The brief contract (golden corpus and the script that writes it)
        run: |
          python3 -m pea_knowledge contract
          python3 -I contract/make_golden.py --check
      - name: Transcript v1 conformance tests
        run: python3 -I spec/transcript-v1/test_conformance.py
      - name: An offline run from the saved fixtures, checked as an app would
        run: |
          python3 -m pea_knowledge run --config tests/fixtures/sources.strict.json --out "$RUNNER_TEMP/dist" --offline-fixtures tests/fixtures/web --now 2026-11-14T12:00:00Z
          python3 -m pea_knowledge validate "$RUNNER_TEMP/dist"
          python3 -m pea_knowledge check-briefs "$RUNNER_TEMP/dist"
          diff -r "$RUNNER_TEMP/dist" tests/golden/dist
